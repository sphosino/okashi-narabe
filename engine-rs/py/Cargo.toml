[package]
name = "okashi-py"
version = "0.1.0"
edition = "2021"
description = "Pythonから使う自己対局ドライバ（MCTSはRust、推論はPython側のPyTorch）"

[lib]
name = "okashi_rs"
crate-type = ["cdylib"]

[dependencies]
okashi-core = { path = "../core" }
okashi-mcts = { path = "../mcts" }
pyo3 = { version = "0.22", features = ["extension-module"] }
