name = "okashi-narabe"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# api.mataasobo.com で受ける（DNS は wrangler が作る）
routes = [{ pattern = "api.mataasobo.com", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# 無料プランで使える SQLite 版の Durable Object
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Lobby"]
